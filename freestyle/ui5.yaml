# Live-Modus: Daten kommen von https://services.odata.org (Northwind, OData V4)
specVersion: "4.0"
metadata:
  name: orders-freestyle
type: application
framework:
  name: SAPUI5
  version: "1.136.23"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.f
    - name: sap.uxap
    - name: sap.ui.layout
    - name: sap.ui.export
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: ui5-middleware-simpleproxy
      afterMiddleware: compression
      mountPath: /northwind
      configuration:
        baseUri: https://services.odata.org/V4/Northwind/Northwind.svc
